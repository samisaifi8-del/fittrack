<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0907">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bar Screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poiret+One&family=Josefin+Sans:wght@300;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&display=swap">
<style>
/* The remote: four tabs (Walls, Bar, Games, Settings), one dock with Message and Blackout on every
   tab, a request bar for guests' asks, and one bottom sheet at a time. Dark only. */
:root {
  --bg: #0a0907; --s1: #13110e; --s2: #1b1814; --s3: #25211b; --hair: #2a251e;
  --ivory: #f2ead8; --ivory2: #cfc6b2; --mute: #8b826f; --mute2: #5c5548;
  --gold: #b89a63; --goldt: #d3b984; --gink: #15100a; --golddim: rgba(184,154,99,.14);
  --rouge: #c06a55;
  --f-display: "Poiret One", Georgia, serif;
  --f-cap: "Josefin Sans", "Barlow Condensed", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad: 20px; --r: 10px; --sel: inset 0 0 0 1px var(--gold);
  --tabh: 64px; --safe: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@media (max-width: 360px) { :root { --pad: 16px; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ivory); }
html { -webkit-text-size-adjust: 100%; }
body { font: 400 16px/1.4 var(--f-body); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--goldt); outline-offset: 2px; }
.cap { font: 600 11px/1 var(--f-cap); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
.wrapw { max-width: 720px; margin: 0 auto; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 6px; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -16px; height: 16px; background: linear-gradient(var(--bg), rgba(10,9,7,0)); pointer-events: none; }
.toprow { display: flex; align-items: center; justify-content: space-between; height: 48px; max-width: 720px; margin: 0 auto; }
.mark { font: 400 19px/1 var(--f-display); letter-spacing: .24em; color: var(--ivory); display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mark i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute2); display: inline-block; flex: none; }
.mark i.ok { background: var(--gold); }
.iconbtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; position: relative; color: var(--ivory2); margin-right: -12px; flex: none; }
.badge { position: absolute; top: 7px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--gold); color: var(--gink); font: 700 11px/18px var(--f-body); text-align: center; padding: 0 5px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 4px calc(var(--pad) * -1) 0; padding: 0 var(--pad) 6px; max-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 40px; margin: 4px 0; padding: 0 14px; border-radius: 20px; background: var(--s2); display: flex; align-items: center; gap: 8px; font: 500 14px/1 var(--f-body); color: var(--ivory2); white-space: nowrap; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: none; }
.chip.hot { background: var(--golddim); color: var(--goldt); }
.chip.dark { background: var(--golddim); color: var(--ivory); box-shadow: var(--sel); }

/* pages */
main { padding: 0 var(--pad) calc(var(--tabh) + var(--safe) + 104px); max-width: 720px; margin: 0 auto; }
.page { display: none; }
.page.on { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
h1 { margin: 6px 0 2px; font: 400 34px/1.05 var(--f-display); letter-spacing: .01em; overflow-wrap: anywhere; }
.sub { color: var(--mute); font-size: 15px; margin: 6px 0 0; }
.sect { margin: 24px 0 12px; display: flex; align-items: center; gap: 14px; }
.sect::after { content: ""; flex: 1; order: 1; height: 3px; border-top: 1px solid #2e281f; border-bottom: 1px solid #1d1914; }
.sect .lnk { order: 2; font: 500 15px var(--f-body); color: var(--goldt); height: 48px; display: flex; align-items: center; margin: -16px 0; padding-left: 4px; }

/* hero */
.hero { margin-top: 8px; padding: 14px; border-radius: var(--r); position: relative;
  background: radial-gradient(90% 120% at 15% 50%, rgba(184,154,99,.10), transparent 60%), var(--s1);
  box-shadow: inset 0 0 0 1px rgba(184,154,99,.42), inset 0 0 0 4px var(--s1), inset 0 0 0 5px rgba(184,154,99,.16); }
.hrow { display: flex; gap: 18px; align-items: center; min-height: 129px; }
.walls { display: flex; gap: 7px; flex: none; }
.wall { width: 58px; height: 87px; border-radius: 5px; background: #000; position: relative; overflow: hidden; box-shadow: 0 0 0 1px #2b261f, 0 10px 30px rgba(0,0,0,.6); transition: opacity .2s; }
.wall.off { opacity: .25; }
.wall.dim { opacity: .4; }
.herotxt { min-width: 0; flex: 1; }
.scope { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; margin: 0 0 6px; border-radius: 18px; color: var(--ivory2); box-shadow: inset 0 0 0 1px var(--hair); background: var(--bg); white-space: nowrap; }
.scope.plain { box-shadow: none; background: none; padding: 0; color: var(--mute); }
.herotxt h1 { font-size: 36px; line-height: 1.02; margin: 0; height: 37px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.herotxt h1.long { font-size: 29px; }
.mode { display: flex; align-items: center; flex-wrap: nowrap; column-gap: 14px; height: 44px; margin-top: 4px; color: var(--mute); font-size: 15px; min-height: 44px; }
.mode > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mode button { flex: none; }
.mode button { color: var(--goldt); font-weight: 500; height: 44px; display: flex; align-items: center; }
.hero .ctx { border-top: 1px solid #2a251e; margin: 14px -14px -14px; width: calc(100% + 28px); min-height: 58px; padding: 6px 14px; display: flex; align-items: center; gap: 14px; text-align: left; }
.hero .ctx .ico { width: 32px; height: 32px; }

.row .t, .li .t, .ctx .t { flex: 1; min-width: 0; }
.ctx .t b, .li .t b { display: block; font-weight: 500; font-size: 16px; color: var(--ivory); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx .t span, .li .t > span { display: block; font-size: 14px; color: var(--mute); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--mute2); flex: none; }
.ico { width: 36px; height: 36px; border-radius: 50%; background: var(--s3); display: grid; place-items: center; flex: none; color: var(--goldt); }

/* channel grid */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ch { height: 80px; border-radius: var(--r); background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); padding: 11px 13px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: background .15s; min-width: 0; }
.ch .n { font: 400 26px/1 var(--f-display); color: var(--gold); opacity: .75; }
.ch .nm { font: 500 14px/1.15 var(--f-body); color: var(--ivory2); }
.ch.on { background: var(--golddim); box-shadow: inset 0 0 0 1px var(--gold), inset 0 0 0 4px #1a160f, inset 0 0 0 5px rgba(184,154,99,.35); }
.ch.on .n { opacity: 1; }
.ch.on .nm { color: var(--ivory); }
.ch .air { position: absolute; top: 12px; right: 12px; font: 700 8.5px/1 var(--f-cap); letter-spacing: .18em; color: var(--gink); background: var(--gold); padding: 4px 5px 3px; border-radius: 3px; }
.ch .air.out { background: none; color: var(--goldt); box-shadow: inset 0 0 0 1px var(--gold); }
.ch .cnt { position: absolute; top: 12px; right: 12px; font: 500 12px/1 var(--f-body); color: var(--goldt); display: flex; align-items: center; gap: 5px; }
.ch .cnt::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.ch:active { background: var(--s2); }
@media (min-width: 600px) { .ch { height: 88px; } }

/* sliders */
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 48px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--gold) var(--p, 50%), var(--s3) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--s3); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--gold); }
input[type=range]:disabled { opacity: .3; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ivory); margin-top: -12px; box-shadow: 0 2px 10px rgba(0,0,0,.6); }
input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--ivory); }
.slide { display: flex; align-items: center; gap: 12px; }
.slide .v { font: 500 15px/1 var(--f-body); color: var(--ivory2); width: 48px; text-align: right; flex: none; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: calc(var(--tabh) + var(--safe)); z-index: 25; padding: 14px var(--pad) 12px; background: linear-gradient(rgba(10,9,7,0), var(--bg) 22%); }
.dock > div { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.dockrow { display: flex; gap: 10px; }
.dbright { display: flex; align-items: center; gap: 14px; height: 48px; color: var(--mute); padding: 0 4px; }
.dbright .val { font: 500 15px/1 var(--f-body); width: 40px; text-align: right; color: var(--ivory2); }
.btn { height: 56px; border-radius: 14px; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font: 500 16px/1 var(--f-body); background: var(--s2); color: var(--ivory); box-shadow: inset 0 0 0 1px var(--hair); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 14px; }
.btn > span { overflow: hidden; text-overflow: ellipsis; }
.btn svg { flex: none; }
.btn.gold { background: var(--gold); color: var(--gink); font-weight: 600; box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 0 4px rgba(21,16,10,.32); }
.btn.ivory { background: var(--ivory); color: var(--gink); font-weight: 600; box-shadow: none; }
.btn.goldline { background: var(--golddim); color: var(--ivory); box-shadow: var(--sel); }
.btn.ghost { background: transparent; color: var(--goldt); box-shadow: none; }
.btn.line { background: transparent; box-shadow: inset 0 0 0 1px var(--hair); color: var(--ivory2); }
.btn.warn { background: transparent; color: var(--rouge); box-shadow: inset 0 0 0 1px rgba(192,106,85,.5); }
.btn.armed { background: var(--rouge); color: #fff; box-shadow: none; }
.btn[disabled] { background: var(--s1); color: var(--mute2); cursor: default; box-shadow: inset 0 0 0 1px var(--hair); }
.btn.sm { flex: none; padding: 0 22px; }
.btn.narrow { flex: none; width: 92px; padding: 0 8px; }
.dockrow.four { gap: 8px; }
.dockrow.four .btn { font-size: 15px; padding: 0 10px; }
.btn.small { height: 48px; font-size: 15px; }
.btn:active:not([disabled]) { transform: scale(.98); }
.qk { flex: none; width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--s2); color: var(--ivory2); box-shadow: inset 0 0 0 1px var(--hair); position: relative; }
.qk.lit { background: var(--golddim); color: var(--goldt); box-shadow: var(--sel); }
.rbar { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; border-radius: 14px; background: #1d1912; box-shadow: inset 0 0 0 1px rgba(184,154,99,.5), 0 10px 30px rgba(0,0,0,.6); min-height: 64px; margin-bottom: 4px; animation: up .28s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.rbar .t { flex: 1; min-width: 0; text-align: left; min-height: 48px; display: flex; flex-direction: column; justify-content: center; }
.rbar .t b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rbar .t span { display: block; color: var(--goldt); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rbar .no, .req .no { height: 48px; padding: 0 10px; color: var(--mute); font-size: 15px; flex: none; }
.rbar .yes, .req .yes { height: 48px; padding: 0 16px; border-radius: 12px; background: var(--gold); color: var(--gink); font-weight: 600; font-size: 15px; flex: none; }
.rbar .more { font: 600 10px/1 var(--f-cap); letter-spacing: .14em; color: var(--goldt); height: 48px; padding: 0 4px; flex: none; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--tabh) + var(--safe)); padding-bottom: var(--safe); background: rgba(13,12,10,.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid #1a1713; }
.tabs > div { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabh); max-width: 720px; margin: 0 auto; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--mute2); font: 600 10px/1 var(--f-cap); letter-spacing: .16em; text-transform: uppercase; position: relative; }
.tab[aria-current="page"] { color: var(--goldt); }
.tab .dot { position: absolute; top: 10px; left: calc(50% + 10px); width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

/* choices */
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { height: 48px; padding: 0 18px; border-radius: 24px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); color: var(--ivory2); font: 500 15px/1 var(--f-body); display: flex; align-items: center; gap: 9px; max-width: 100%; }
.pick > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick.on { background: var(--golddim); color: var(--ivory); box-shadow: var(--sel); }
.pick .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.drinks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 600px) { .drinks { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.dk { height: 56px; border-radius: var(--r); background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; font: 500 15px/1.15 var(--f-body); color: var(--ivory2); min-width: 0; }
.dk span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dk svg { flex: none; }
.dk.on { background: var(--golddim); color: var(--ivory); box-shadow: var(--sel); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--s1); border-radius: 14px; padding: 4px; gap: 4px; box-shadow: inset 0 0 0 1px var(--hair); }
.seg button { height: 48px; border-radius: 10px; color: var(--ivory2); font: 500 15px/1 var(--f-body); padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button.on { background: var(--golddim); color: var(--ivory); box-shadow: var(--sel); }
.seg button.on span { color: var(--goldt); }
.seg button:disabled { opacity: .4; cursor: default; }

/* switch */
.sw2 { width: 52px; height: 32px; border-radius: 16px; background: var(--s3); position: relative; flex: none; transition: background .2s; }
.sw2::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--mute); transition: transform .2s, background .2s; }
.sw2.on { background: var(--gold); }
.sw2.on::after { transform: translateX(20px); background: var(--gink); }
.swhit { width: 64px; height: 48px; display: grid; place-items: center; margin-right: -6px; flex: none; }

/* feature cards */
.feature { border-radius: var(--r); background: radial-gradient(120% 100% at 20% 0%, #1d1913 0%, var(--s1) 60%); padding: 18px; margin-top: 14px; box-shadow: inset 0 0 0 1px rgba(184,154,99,.42), inset 0 0 0 4px var(--s1), inset 0 0 0 5px rgba(184,154,99,.16); }
.feature .cap { color: var(--goldt); }
.feature h2 { margin: 8px 0 2px; font: 400 28px/1.05 var(--f-display); overflow-wrap: anywhere; }
.feature .meta { color: var(--mute); font-size: 15px; }
.feature .acts { display: flex; gap: 10px; margin-top: 16px; clear: both; }
.glass { float: right; width: 48px; height: 64px; margin: -2px 0 0 12px; }
.onair { display: flex; align-items: center; flex-wrap: wrap; column-gap: 6px; min-height: 48px; margin-top: 8px; font-size: 15px; color: var(--mute); }
.onair .lnk { color: var(--goldt); font-weight: 500; height: 48px; display: flex; align-items: center; }
.onair .lit { color: var(--goldt); display: flex; align-items: center; gap: 8px; }
.dotg { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); display: inline-block; }

.req { display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 18px; border-radius: var(--r); background: var(--golddim); box-shadow: inset 0 0 0 1px rgba(184,154,99,.35); min-height: 72px; }
.req + .req { margin-top: 8px; }
.req .t { flex: 1; min-width: 0; }
.req .t b { display: block; font-weight: 500; }
.req .t span { color: var(--goldt); font-size: 14px; display: block; overflow-wrap: anywhere; }

.list { border-radius: var(--r); background: var(--s1); overflow: hidden; box-shadow: inset 0 0 0 1px var(--hair); }
.list .li { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 18px; width: 100%; text-align: left; position: relative; }
.list .li + .li::before { content: ""; position: absolute; top: 0; left: 18px; right: 0; height: 1px; background: #201c17; }
.li .v { color: var(--mute); font-size: 15px; white-space: nowrap; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.li.danger .t b { color: var(--rouge); }
.li.goldrow .t b { color: var(--goldt); }
.li.compact { gap: 10px; padding: 8px 10px 8px 12px; }
.li.compact::before { left: 12px !important; }
.check { color: var(--gold); flex: none; }
.tag { font: 700 9px/1 var(--f-cap); letter-spacing: .18em; color: var(--goldt); background: var(--golddim); padding: 5px 7px 4px; border-radius: 5px; margin-left: 8px; vertical-align: 2px; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.pl { height: 44px; padding: 0 16px 0 6px; border-radius: 22px; background: var(--s1); display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; max-width: 100%; }
.pl i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 13px/1 var(--f-body); font-style: normal; color: var(--gink); flex: none; }
.pl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { color: var(--mute); font-size: 14px; margin: 12px 4px 0; }
.empty { color: var(--mute); font-size: 15px; padding: 18px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--hair); text-align: center; }
.gap { height: 20px; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; background: #100e0b; border-radius: 28px 28px 0 0; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s; box-shadow: 0 -20px 60px rgba(0,0,0,.6); max-width: 720px; margin: 0 auto; visibility: hidden; outline: none; }
.sheet.on { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.sheet.tall { height: 92vh; height: 92dvh; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--s3); margin: 9px auto 0; flex: none; }
.sheet .hd { display: flex; align-items: center; justify-content: space-between; padding: 8px var(--pad) 0; flex: none; }
.sheet .hd button { height: 48px; color: var(--goldt); font-weight: 500; padding-left: 16px; }
.sheet .shtop { flex: none; display: flex; gap: 16px; align-items: flex-start; padding: 6px var(--pad) 12px; border-bottom: 1px solid #1d1914; }
.sheet .bd { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--pad) 16px; flex: 1; }
.sheet .ft { flex: none; padding: 10px var(--pad) calc(16px + var(--safe)); display: flex; gap: 10px; }
.sheet h1 { font-size: 34px; margin: 2px 0 4px; }
.field { width: 100%; min-height: 56px; border-radius: 16px; background: var(--s1); border: 0; outline: 0; padding: 16px 18px; font-size: 17px; color: var(--ivory); display: block; }
.field::placeholder { color: var(--mute2); }
.field:focus { box-shadow: inset 0 0 0 1px rgba(184,154,99,.5); }
textarea.field { resize: none; line-height: 1.35; }
.msgfield { font: 400 30px/1.15 var(--f-display); min-height: 132px; text-transform: uppercase; letter-spacing: .04em; }
.swatches { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
.swatch { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.swatch i { width: 30px; height: 30px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.swatch.on { box-shadow: inset 0 0 0 1.5px var(--gold); }
.swatch.any { position: relative; }
.swatch.any::before { content: ""; position: absolute; width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(#c06a55, #e8d58f, #9fb3a2, #93a7b8, #a9a2c4, #c06a55); pointer-events: none; }
.swatch.any::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #100e0b; pointer-events: none; }
.swatch.any input[type=color] { opacity: 0; position: relative; z-index: 1; }
.swatch input[type=color] { width: 30px; height: 30px; border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; }
.swatch input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.swatch input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
.lab { margin: 24px 0 10px; display: block; }
.lab2 { display: block; font-size: 14px; color: var(--mute); margin: 16px 2px 8px; }
.poster { width: 96px; height: 144px; border-radius: 6px; flex: none; background: linear-gradient(160deg, #2a2218, #0e0c09); box-shadow: inset 0 0 0 1px rgba(184,154,99,.55), inset 0 0 0 5px #0e0c09, inset 0 0 0 6px rgba(184,154,99,.3); display: grid; place-items: center; font: 400 46px/1 var(--f-display); color: var(--gold); overflow: hidden; }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.poster.sm { width: 40px; height: 60px; font-size: 20px; border-radius: 4px; }
.film { display: flex; gap: 18px; align-items: flex-end; margin-top: 8px; }
.film > div:last-child { min-width: 0; }
.film h2 { margin: 6px 0 4px; font: 400 30px/1.05 var(--f-display); overflow-wrap: anywhere; }
.film h2.long { font-size: 24px; }
.film .meta { color: var(--mute); font-size: 14px; }
.count { font: 400 64px/1 var(--f-display); color: var(--ivory); margin: 26px 0 4px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.qr { width: 220px; height: 220px; margin: 16px auto 6px; background: var(--ivory); border-radius: 18px; padding: 14px; display: grid; place-items: center; }
.qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.link { text-align: center; color: var(--mute); font-size: 14px; margin: 0; overflow-wrap: anywhere; }
.thumb { width: 44px; height: 66px; border-radius: 4px; flex: none; overflow: hidden; position: relative; background: #000; }
.pv { width: 96px; height: 144px; flex: none; border-radius: 5px; overflow: hidden; background: #000; position: relative; box-shadow: 0 0 0 1px #2b261f; }
.pv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.nums label > span { display: block; margin: 0 0 8px 4px; }
.prog { height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden; margin-top: 6px; }
.prog i { display: block; height: 100%; background: var(--gold); }
.minibtn { height: 40px; padding: 0 14px; border-radius: 20px; background: var(--s2); box-shadow: inset 0 0 0 1px var(--hair); font: 500 14px/1 var(--f-body); color: var(--ivory2); flex: none; }
.xbtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--mute); flex: none; margin-right: -10px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + var(--safe) + var(--dockh, 92px) + 10px); transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--ivory); color: var(--gink); padding: 12px 20px; border-radius: 24px; font-weight: 500; font-size: 15px; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.over { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 14px); }

/* mini wall art */
.art { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--ivory); overflow: hidden; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art .w1 { font: 400 7px/1.2 var(--f-display); letter-spacing: .2em; }
.art .rule { width: 60%; height: 3px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); opacity: .8; margin: 4px 0; }
.art .tx { white-space: pre-line; word-break: break-word; padding: 0 4px; line-height: 1.1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
<header class="top">
  <div class="toprow">
    <div class="mark"><span id="barName">THE BASEMENT</span><i id="conn" title="Reconnecting"></i></div>
    <button type="button" class="iconbtn" data-act="sheet" data-v="inbox" aria-label="Waiting for you" id="inboxBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 13l2.2-7.2A1 1 0 017.2 5h9.6a1 1 0 011 .8L20 13v5a1 1 0 01-1 1H5a1 1 0 01-1-1v-5z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
  </div>
  <div class="chips" id="chips" hidden></div>
</header>

<main id="main">
  <section class="page" id="p-walls" aria-label="Walls"></section>
  <section class="page" id="p-bar" aria-label="Bar"></section>
  <section class="page" id="p-games" aria-label="Games"></section>
  <section class="page" id="p-settings" aria-label="Settings"></section>
</main>

<div class="dock" id="dock"><div>
  <div id="rbar"></div>
  <div class="dbright" id="dbright" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    <input type="range" id="brightness" min="5" max="100" step="1" aria-label="Brightness">
    <span class="val" id="bval"></span>
  </div>
  <div class="dockrow" id="drow"></div>
</div></div>

<nav class="tabs" aria-label="Sections"><div id="tabs">
  <button type="button" class="tab" data-act="tab" data-v="walls"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="6.5" height="16" rx="1"/><rect x="13.5" y="4" width="6.5" height="16" rx="1"/></svg>Walls</button>
  <button type="button" class="tab" data-act="tab" data-v="bar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5h14c0 4.5-3 7.5-7 7.5S5 9.5 5 5z"/><path d="M12 12.5V19M8 19.5h8"/></svg>Bar<span class="dot" id="barDot" hidden></span></button>
  <button type="button" class="tab" data-act="tab" data-v="games"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 9-8 9-8-9z"/><path d="M12 8l3.5 4-3.5 4-3.5-4z"/></svg>Games<span class="dot" id="gameDot" hidden></span></button>
  <button type="button" class="tab" data-act="tab" data-v="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</div></nav>

<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shCap" tabindex="-1">
  <div class="grab"></div>
  <div class="hd"><span class="cap" id="shCap"></span><button type="button" data-act="close">Done</button></div>
  <div class="shtop" id="shTop" hidden></div>
  <div class="bd" id="shBody"></div>
  <div class="ft" id="shFoot"></div>
</div>
<input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const title = (n) => String(n || '').replace(/\b(\w)(\w*)/g, (m, a, b) => a + b.toLowerCase());
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bar-screens:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('bar-screens:' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ------------------------------------------------------------ constants

  // The nine tiles. Tile 6 covers the three party-game channels; which one is the game's choice.
  const TILES = [
    [1, 'The Bar', 'rotation'], [2, 'Scores', 'scores'], [3, 'News', 'news'],
    [4, 'Weather', 'weather'], [5, 'Visuals', 'visuals'], [6, 'Games', 'games'],
    [7, 'Basement Live', 'live'], [8, 'Now Showing', 'nowshowing'], [9, 'The House Pour', 'pour'],
  ];
  const GAME_CH = ['games', 'colours', 'verdict'];
  // The number the wall itself shows: the pour tile is channel 10, and the games tile is 6, 9 or 11 by game.
  const shownNum = (n, ch) => (n === 9 ? 10 : n === 6 ? ({ colours: 9, verdict: 11 }[ch] || 6) : n);
  const tileOf = (ch) => (GAME_CH.includes(ch) ? 6 : (TILES.find((t) => t[2] === ch) || TILES[0])[0]);
  const GAME_INFO = {
    closest: ['Guess the number. The best opener.', 'party'],
    fiveclues: ['Buzz early for more points. Wrong and you are out.', 'party', 1],
    fivelights: ['Never have I ever, answered in secret.', 'party', 1],
    verdict: ['Who in the room is most likely to…', 'party', 1],
    colours: ['The walls take sides for tonight\'s match.', 'party', 1],
    quickdraw: ['Wait for DRAW, then tap first.', 'arcade'],
    duel: ['Two players, one ball, first to 7.', 'arcade'],
    snake: ['Everyone gets a snake.', 'arcade'],
    breaker: ['Slide to move the paddle.', 'arcade'],
  };
  const STYLE_NAMES = { mix: 'Mix', botanical: 'Banana leaves', skyline: 'Dark deco city', deco: 'The Basement sign', lift: 'Lift indicator', clockface: 'Deco clock', fans: 'Art deco fans', bubbles: 'Champagne bubbles' };
  const MSG_COL = [['Ivory', '#f2ead8'], ['Gold', '#d3b984'], ['Champagne', '#e8d58f'], ['Rouge', '#c06a55']];
  // single quotes inside: these go into style="..." attributes
  const FONTS = [['Poiret One', 'Poiret', "400 1em 'Poiret One'"], ['Josefin Sans', 'Josefin', "600 1em 'Josefin Sans'"], ['Bebas Neue', 'Bebas', "400 1em 'Bebas Neue'"], ['Anton', 'Anton', "400 1em 'Anton'"], ['Barlow Condensed', 'Barlow', "700 1em 'Barlow Condensed'"]];
  const FONT_CSS = Object.fromEntries(FONTS.map((f) => [f[0], f[2]]));
  const GLASS_NAMES = { coupe: 'Coupe', rocks: 'Rocks', highball: 'Highball', flute: 'Flute', martini: 'Martini', mug: 'Mug', wine: 'Wine glass' };
  const EXT_FOR = { 'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif', 'image/webp': '.webp', 'image/heic': '.heic', 'video/mp4': '.mp4', 'video/quicktime': '.mov', 'video/webm': '.webm' };
  const QUICK = 'Quick message';
  const SECS = [6, 10, 15, 20, 30];

  const I = {
    chev: '<svg class="chev" width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l6 6-6 6"/></svg>',
    down: '<svg width="10" height="7" viewBox="0 0 10 7" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>',
    check: '<svg class="check" width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 7.5l5 5L16.5 1.5"/></svg>',
    msg: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    moon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 14.5A7.5 7.5 0 019.5 5a7.5 7.5 0 109.5 9.5z"/></svg>',
    plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>',
    play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l10 10M12 2L2 12"/></svg>',
    cam: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3z"/></svg>',
    stack: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M3 6v12M21 6v12"/></svg>',
    ball: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l4 3-1.5 4.5h-5L8 10.5z"/></svg>',
    film: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 5v14M17 5v14M3 9.5h4M17 9.5h4M3 14.5h4M17 14.5h4"/></svg>',
    coupe: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5h14c0 4.5-3 7.5-7 7.5S5 9.5 5 5z"/><path d="M12 12.5V19M8 19.5h8"/></svg>',
    sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
    news: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
    fan: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 19a9 9 0 0118 0z"/><path d="M12 19L7 11M12 19l5-8M12 19V10"/></svg>',
    dia: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 9-8 9-8-9z"/></svg>',
  };

  // ------------------------------------------------------------ state

  let S = null;               // the server's snapshot (/api/events)
  let roster = null;          // the games' roster ({game, joinUrl, onWall, players}) from /api/game/stream
  let partyView = null;       // the party game's wall view (phase, round...) from the same stream
  let connected = false;
  const UI = {
    tab: store.get('tab', 'walls'),
    scope: store.get('scope', 'both'),
    sheet: null, arg: null, back: null,
    pick: { guest: '', drink: '' }, other: '',
    msgDraft: '', msgColor: store.get('msgColor', MSG_COL[0][1]), recent: store.get('recent', []),
    film: { q: '', results: null, ask: 0, busy: false },
    uploads: [], armed: {}, matches: null, years: null, house: null,
    newDrink: { name: '', glass: 'coupe', colour: '#e3a63a' },
    editing: null, seenReq: null,
  };
  if (!['walls', 'bar', 'games', 'settings'].includes(UI.tab)) UI.tab = 'walls';

  // ------------------------------------------------------------ helpers

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('over', !!UI.sheet);
    t.classList.add('on');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('on'), 2200);
  }
  async function api(method, path, body) {
    let res;
    try {
      res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    } catch (e) {
      throw new Error("Can't reach the Pi. Check you're on the same Wi-Fi.");
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || `Something went wrong (${res.status}).`);
    return data;
  }
  // Writes: apply locally first so the tap answers at once; if the Pi says no, toast and resync.
  async function write(method, path, body, local) {
    if (local && S) { try { local(S); render(); } catch (e) {} }
    try { return await api(method, path, body); } catch (e) { toast(e.message); resync(); throw e; }
  }
  const quiet = (p) => p.catch(() => {});
  async function resync() { try { S = await api('GET', '/api/state'); prep(); render(); } catch (e) {} }
  function debounce(fn, ms) {
    let t = 0;
    const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    d.flush = (...a) => { clearTimeout(t); fn(...a); };
    return d;
  }
  const vibrate = () => { try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} };
  // A 2-tap guard: the first tap arms it for 3 s (the label changes); the second does it.
  function armed(key, rerender) {
    if (UI.armed[key]) { clearTimeout(UI.armed[key]); delete UI.armed[key]; return true; }
    vibrate();
    UI.armed[key] = setTimeout(() => { delete UI.armed[key]; rerender(); }, 3000);
    rerender();
    return false;
  }
  const sw = (on, act, v, label) => `<span class="swhit"><button type="button" class="sw2 ${on ? 'on' : ''}" data-act="${act}" ${v != null ? `data-v="${esc(v)}"` : ''} role="switch" aria-checked="${!!on}" aria-label="${esc(label || '')}"></button></span>`;
  const seg = (act, opts, cur, extra = '') => `<div class="seg" role="group">${opts.map(([v, l, s]) => `<button type="button" class="${String(v) === String(cur) ? 'on' : ''}" aria-pressed="${String(v) === String(cur)}" data-act="${act}" data-v="${esc(v)}" ${extra}>${esc(l)}${s ? ` <span>${esc(s)}</span>` : ''}</button>`).join('')}</div>`;
  const li = (b, v, act, val, s, cls = '') => `<button type="button" class="li ${cls}" data-act="${act}" data-v="${esc(val)}"><span class="t"><b>${b}</b>${s ? `<span>${s}</span>` : ''}</span>${v != null && v !== '' ? `<span class="v">${v}</span>` : ''}${I.chev}</button>`;
  const liSwitch = (b, s, on, act, label) => `<div class="li"><span class="t"><b>${b}</b>${s ? `<span>${s}</span>` : ''}</span>${sw(on, act, null, label || b)}</div>`;
  function setHTML(el, markup) { if (el.dataset.h !== markup) { el.dataset.h = markup; el.innerHTML = markup; return true; } return false; }

  // ------------------------------------------------------------ derived state

  const screen = (id) => S.screens.find((s) => s.id === id);
  const slideById = (id) => S.slides.find((s) => s.id === id);
  const enabled = () => S.screens.filter((s) => s.enabled);
  const bothOn = () => enabled().length > 1;
  // The walls a channel tap, Show now or Pour acts on.
  function scopeWalls() {
    const en = enabled();
    if (UI.scope === 'both' || !bothOn()) return en.length ? en : [S.screens[0]];
    return en.filter((s) => s.id === UI.scope);
  }
  function focusScreen() { return UI.scope === 's2' && bothOn() ? screen('s2') : (enabled()[0] || S.screens[0]); }
  const split = () => bothOn() && tileOf(screen('s1').channel) !== tileOf(screen('s2').channel);
  const gameKey = () => S.channels.games.game;
  const gameName = (k = gameKey()) => (S.catalog.games.find((g) => g[0] === k) || [k, title(k)])[1];
  const gameChannel = () => (['colours', 'verdict'].includes(gameKey()) ? gameKey() : 'games');
  const gameOnWalls = () => enabled().some((s) => GAME_CH.includes(s.channel));
  const isParty = (k = gameKey()) => (GAME_INFO[k] || [])[1] === 'party';
  const players = () => (roster && roster.players) || [];
  const partyNow = () => (partyView && partyView.game === gameKey() ? partyView : null);
  // Playing (not waiting for players): a party game past its lobby, an arcade game with players.
  function gamePlaying() {
    if (!gameOnWalls()) return false;
    if (isParty()) { const p = partyNow(); return !!(p && p.phase && p.phase !== 'lobby'); }
    return players().length > 0;
  }
  function gameStep() {
    const p = partyNow();
    if (!p) return '';
    const k = gameKey(), r = p.n || p.round || 0;
    if (k === 'colours') {
      if (!p.match) return 'no match pinned';
      const sc = p.score || { home: 0, away: 0 };
      return `${p.match.home.abbr} ${sc.home}–${sc.away} ${p.match.away.abbr}`;
    }
    if (!r) return '';
    const of = p.of ? ` of ${p.of}` : '';
    return ({ closest: `Question ${r}${of}`, fiveclues: `Card ${r}${of}`, fivelights: `Prompt ${r}`, verdict: `Prompt ${r}` })[k] || `Round ${r}`;
  }
  const sipsOn = () => (S.channels.games.sipsUntil || 0) * 1000 > Date.now();
  const RUNNING = ['countdown', 'film', 'intermission'];
  const cinemaNow = () => Date.now() / 1000 + ((S.cinema && S.cinema.clock) || 0);
  const mmss = (secs) => { const n = Math.max(0, Math.ceil(secs)); return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`; };
  const filmOnWalls = () => !!(S.cinema && S.cinema.film) && (RUNNING.includes(S.cinema.phase) || S.cinema.phase === 'end' || enabled().some((s) => s.channel === 'nowshowing'));
  function filmLine() {
    const c = S.cinema, f = c && c.film;
    if (!f) return 'Pick tonight\'s film';
    const T = cinemaNow();
    if (c.phase === 'countdown') return c.until > T ? `Starting in <span data-timer>${mmss(c.until - T)}</span>` : 'The curtains are closing';
    if (c.phase === 'film') return 'Playing · walls dark';
    if (c.phase === 'intermission') return `Intermission · back in <span data-timer>${mmss(c.until - T)}</span>`;
    if (c.phase === 'end') return 'The End · then back to The Bar';
    return enabled().some((s) => s.channel === 'nowshowing') ? 'Poster up · ready to start' : 'Ready when you are';
  }
  function filmMeta(f) {
    const parts = [];
    if (f.year) parts.push(f.year);
    if (f.runtime) parts.push(`${Math.floor(f.runtime / 60)}h ${f.runtime % 60}m`.replace(/^0h /, '').replace(/ 0m$/, ''));
    return parts.join(' · ');
  }
  // The quick message: a slide named "Quick message" pinned on a wall.
  function message() {
    const m = S.slides.find((s) => s.name === QUICK && S.screens.some((sc) => sc.pinned === s.id));
    return m || null;
  }
  const drinkReqs = () => (S.bar && S.bar.requests) || [];
  const promptReqs = () => (S.party && S.party.game === 'verdict' && S.party.waiting) || [];
  function queueAll() {
    return [...drinkReqs().map((r) => ({ kind: 'drink', id: r.rid, who: title(r.name), text: title(r.drink.name), at: r.at || 0 })),
      ...promptReqs().map((w) => ({ kind: 'prompt', id: w.id, who: title(w.by), text: w.text }))];
  }
  const allDrinks = () => [...S.catalog.drinks, ...S.channels.pour.custom];
  const rotationSlides = () => S.slides.filter((s) => s.name !== QUICK);

  // ------------------------------------------------------------ drawings

  // key: unique per place it's drawn (clip ids must not resolve into a hidden page)
  function glassSvg(type, color, fill = 0.62, w = 64, h = 84, key = '') {
    const P = {
      coupe: ['M10 18h44c0 16-10 26-22 26S10 34 10 18z', 'M32 44v24M20 70h24'],
      rocks: ['M14 22h36l-3 46H17z', ''],
      highball: ['M18 12h28l-2 58H20z', ''],
      flute: ['M24 8h16l-2 34c-1 6-3 8-6 8s-5-2-6-8z', 'M32 50v18M24 70h16'],
      martini: ['M8 14h48L32 42z', 'M32 42v26M22 70h20'],
      mug: ['M12 20h32v48H12z', 'M44 30h6a4 4 0 014 4v14a4 4 0 01-4 4h-6'],
      wine: ['M18 8h28c0 18-6 28-14 28S18 26 18 8z', 'M32 36v32M22 70h20'],
    }[type] || ['M10 18h44c0 16-10 26-22 26S10 34 10 18z', 'M32 44v24M20 70h24'];
    const id = `g-${type}-${String(key).replace(/[^\w-]/g, '')}`;
    const col = /^#[0-9a-f]{6}$/i.test(color || '') ? color : '#b89a63';
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 84" fill="none" aria-hidden="true"><defs><clipPath id="${id}"><path d="${P[0]}"/></clipPath></defs>
      <rect clip-path="url(#${id})" x="0" y="${84 - 84 * fill}" width="64" height="84" fill="${col}" opacity=".85"/>
      <path d="${P[0]}" stroke="#b89a63" stroke-width="2"/>${P[1] ? `<path d="${P[1]}" stroke="#b89a63" stroke-width="2"/>` : ''}</svg>`;
  }
  function slideArt(s, big) {
    if (!s) return '';
    if (s.type === 'image' && s.file) return `<div class="art" style="background:${esc(s.bg || '#000')}"><img src="/media/${encodeURIComponent(s.file)}" alt="" loading="lazy" style="object-fit:${s.fit === 'contain' ? 'contain' : 'cover'};object-position:${s.posX ?? 50}% ${s.posY ?? 50}%"></div>`;
    if (s.type === 'video') return `<div class="art" style="background:radial-gradient(70% 45% at 40% 35%,#5a4630 0%,#1d1610 55%,#060504 100%)"><div style="position:absolute;right:4px;top:4px;width:0;height:0;border-left:6px solid rgba(242,234,216,.75);border-top:4px solid transparent;border-bottom:4px solid transparent"></div>${s.processing ? '<div class="w1" style="font-size:5px;color:#8b826f">CONVERTING</div>' : ''}</div>`;
    const px = big ? 13 : 8;
    const font = FONT_CSS[s.font] || "700 1em 'Barlow Condensed'";
    if (s.type === 'clock') {
      const d = new Date();
      const t = s.hour24 ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M$/i, '');
      return `<div class="art" style="background:${esc(s.bg)}"><div style="font:${font};font-size:${px * 1.8}px;color:${esc(s.color)}">${esc(t)}</div>${s.showDate ? `<div style="font:600 ${px * 0.6}px var(--f-cap);letter-spacing:.2em;color:#8b826f;margin-top:2px">${esc(d.toLocaleDateString([], { weekday: 'long' }).toUpperCase())}</div>` : ''}</div>`;
    }
    // sized so the longest line fits the 44-58 px drawing
    const lines = (s.text || '').trim().split('\n');
    const longest = Math.max(1, ...lines.map((l) => l.length));
    const fit = Math.max(3.5, Math.min(11, 78 / longest, 70 / (lines.length * 1.15)));
    return `<div class="art" style="background:${esc(s.bg || '#000')}"><div class="tx" style="font:${font};font-size:${fit.toFixed(1)}px;color:${esc(s.color)};text-align:${esc(s.align || 'center')}">${esc(lines.join('\n'))}</div></div>`;
  }
  function wallArt(sc) {
    if (!sc.enabled || !S.displayOn || S.settings.blackout) return '';
    if (S.settings.testPattern) return '<div class="art" style="background:repeating-linear-gradient(90deg,#f2ead8 0 7px,#d3b984 7px 14px,#7a8a9a 14px 21px,#9a5a4a 21px 28px,#222 28px 35px)"></div>';
    if (S.mirror && S.mirror.live && ['all', sc.id].includes(S.settings.mirrorScreen || 'all')) return '<div class="art" style="background:linear-gradient(160deg,#2b3240,#121418)"><div class="w1" style="opacity:.7">AIRPLAY</div></div>';
    if (sc.pinned) return slideArt(slideById(sc.pinned));
    const live = (S.live && S.live[sc.id]) || {};
    const label = (t) => `<div class="w1" style="color:#d3b984;font-size:5px">${esc(t)}</div>`;
    switch (sc.channel) {
      case 'rotation': return live.slide ? slideArt(slideById(live.slide)) : `<div class="art" style="background:#050403">${label((S.settings.barName || 'THE BASEMENT').toUpperCase())}<div class="rule" style="width:50%"></div></div>`;
      case 'scores': { const lg = (S.catalog.leagues.find((l) => l[0] === S.channels.scores.leagues[0]) || [0, 'SCORES'])[1]; return `<div class="art" style="background:#0a0907;gap:3px">${label(lg.toUpperCase())}<div style="font:400 10px var(--f-display)">HOME 0</div><div style="font:400 10px var(--f-display)">AWAY 0</div><div class="rule" style="width:40%"></div></div>`; }
      case 'news': { const f = (S.catalog.feeds.find((x) => x[0] === S.channels.news.feed) || [0, 'NEWS'])[1]; return `<div class="art" style="background:#0a0907;align-items:flex-start;padding:8px;gap:3px;justify-content:flex-start">${label(f.toUpperCase())}${[90, 70, 85, 60, 80, 50].map((p) => `<div style="height:2.5px;width:${p}%;background:#cfc6b2;opacity:.55;border-radius:1px"></div>`).join('')}</div>`; }
      case 'weather': { const w = S.channels.weather; return `<div class="art" style="background:linear-gradient(#141210,#0a0907)">${label(w.label ? w.label.toUpperCase() : 'SET A TOWN')}<div style="color:#d3b984;margin-top:6px">${I.sun}</div></div>`; }
      case 'visuals': return '<div class="art" style="background:repeating-conic-gradient(from -90deg at 50% 100%,#1a160f 0 8deg,#2a2216 8deg 16deg)"><div style="position:absolute;bottom:0;width:30%;height:15%;border-radius:50% 50% 0 0;background:#b89a63;opacity:.8"></div></div>';
      case 'games': case 'colours': case 'verdict': {
        const p = partyNow();
        if (gameKey() === 'colours' && p && p.match) {
          const h = p.match.home, a = p.match.away;
          return `<div class="art" style="background:linear-gradient(${esc(h.color || '#6b1f2a')} 0 50%,${esc(a.color || '#1f3a6b')} 50%);filter:brightness(.7)"><div style="font:400 9px var(--f-display);position:absolute;top:22%">${esc(h.abbr)}</div><div style="width:100%;height:1px;background:#d3b984"></div><div style="font:400 9px var(--f-display);position:absolute;bottom:22%">${esc(a.abbr)}</div></div>`;
        }
        return `<div class="art" style="background:#0a0907;gap:4px">${label(gameName().toUpperCase())}<div class="rule" style="width:46%"></div><div style="font:400 6px var(--f-body);color:#8b826f">${players().length ? players().length + ' PLAYING' : 'JOIN ON YOUR PHONE'}</div></div>`;
      }
      case 'live': { const cams = S.golive.cams || []; return `<div class="art" style="background:#050403;gap:3px;padding:4px">${cams.map((n) => `<div style="width:100%;flex:1;border-radius:2px;background:linear-gradient(160deg,#3a3026,#151210);position:relative"><span style="position:absolute;left:3px;bottom:2px;font:600 5px var(--f-body)">${esc(n)}</span></div>`).join('') || label('BASEMENT LIVE')}</div>`; }
      case 'nowshowing': {
        const c = S.cinema, f = c && c.film;
        if (c && c.phase === 'film') return '<div class="art" style="background:#000"></div>';
        if (c && c.phase === 'intermission') return `<div class="art" style="background:#0b0906">${label('INTERMISSION')}<div style="font:400 12px var(--f-display);margin-top:3px" data-timer>${mmss(c.until - cinemaNow())}</div></div>`;
        if (f && f.poster) return `<div class="art"><img src="${esc(f.poster)}" alt=""></div>`;
        return `<div class="art" style="background:linear-gradient(160deg,#2a2218,#0e0c09)">${f ? `<div style="font:400 20px/1 var(--f-display);color:#b89a63">${esc(f.title.replace(/^the\s+/i, '')[0] || '?')}</div><div class="w1" style="font-size:4.5px;margin-top:4px;padding:0 3px">${esc(f.title.toUpperCase())}</div>` : label('NOW SHOWING')}</div>`;
      }
      case 'pour': {
        const o = S.bar.order;
        if (o) return `<div class="art" style="background:#0a0907">${label(o.guest ? 'FOR ' + o.guest : 'THE HOUSE POUR')}${glassSvg(o.drink.glass, o.drink.colour, o.phase === 'served' ? 1 : 0.6, 28, 36, 'w' + sc.id)}<div class="w1" style="font-size:5px">${esc(o.drink.name)}</div></div>`;
        return `<div class="art" style="background:#0a0907;gap:4px">${label('THE HOUSE POUR')}<div class="rule" style="width:50%"></div>${S.bar.menu.slice(0, 3).map((d) => `<div style="font:400 5.5px var(--f-display);letter-spacing:.06em">${esc(d.name)}</div>`).join('')}</div>`;
      }
    }
    return '';
  }

  // ------------------------------------------------------------ header, chips, tabs

  function renderTop() {
    $('barName').textContent = (S.settings.barName || 'THE BASEMENT').toUpperCase();
    $('conn').classList.toggle('ok', connected);
    $('conn').title = connected ? 'Connected' : 'Reconnecting';
    const c = [];
    if (S.settings.blackout) c.push('<button type="button" class="chip dark" data-act="blackout"><i></i>Walls dark</button>');
    if (message()) c.push('<button type="button" class="chip hot" data-act="sheet" data-v="message"><i></i>Message up</button>');
    if (!S.displayOn) c.push('<button type="button" class="chip" data-act="sheet" data-v="hdmi"><i></i>Walls off · HDMI handed over</button>');
    if (filmOnWalls()) c.push(`<button type="button" class="chip" data-act="sheet" data-v="film"><i></i>${esc(S.cinema.film.title)} · ${filmLine().replace(/<[^>]+>/g, '').replace('Poster up · ready to start', 'poster up')}</button>`);
    const o = S.bar.order;
    if (o) c.push(`<button type="button" class="chip" data-act="tab" data-v="bar"><i></i>${esc(title(o.drink.name))}${o.guest ? ` for ${esc(title(o.guest))}` : ''}</button>`);
    if (gamePlaying()) c.push(`<button type="button" class="chip" data-act="tab" data-v="games"><i></i>${esc(gameName())}${gameKey() === 'colours' && gameStep() ? ' · ' + esc(gameStep()) : ' on'}</button>`);
    if (sipsOn()) c.push('<button type="button" class="chip" data-act="tab" data-v="games"><i></i>Sips on</button>');
    const cams = S.golive.cams || [];
    if (cams.length && enabled().some((s) => s.channel === 'live')) c.push(`<button type="button" class="chip" data-act="sheet" data-v="live"><i></i>${cams.length} on camera</button>`);
    if (S.mirror && S.mirror.live) c.push('<button type="button" class="chip" data-act="sheet" data-v="airplay"><i></i>AirPlay on</button>');
    if (S.settings.testPattern) c.push('<button type="button" class="chip" data-act="testPattern"><i></i>Test pattern · turn off</button>');
    setHTML($('chips'), c.join(''));
    $('chips').hidden = !c.length;
    const n = queueAll().length;
    $('badge').hidden = !n;
    $('badge').textContent = n;
    $('inboxBtn').setAttribute('aria-label', n ? `${n} waiting for you` : 'Waiting for you');
    $('barDot').hidden = !drinkReqs().length;
    $('gameDot').hidden = !gamePlaying() && !promptReqs().length;
    document.querySelectorAll('.tab').forEach((t) => { if (t.dataset.v === UI.tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  }

  // ------------------------------------------------------------ Walls

  function ctxRow(tile) {
    const r = (icon, b, s, act, v) => `<button type="button" class="ctx" data-act="${act}" data-v="${v}"><span class="ico">${icon}</span><span class="t"><b>${b}</b><span>${s}</span></span>${I.chev}</button>`;
    const sc = focusScreen();
    switch (tile) {
      case 1: {
        const on = sc.playlist.filter((id) => slideById(id));
        const kinds = [...new Set(on.map((id) => ({ image: 'photos', video: 'video', text: 'text', clock: 'clock' })[slideById(id).type]))];
        return r(I.stack, 'Rotation', on.length ? `${on.length} piece${on.length === 1 ? '' : 's'} · ${kinds.join(', ')}` : 'Nothing in it yet · add photos, text, a clock', 'sheet', 'rotation');
      }
      case 2: { const ls = S.channels.scores.leagues.map((k) => (S.catalog.leagues.find((l) => l[0] === k) || [k, k])[1]); return r(I.ball, 'Leagues', ls.length ? esc(ls.slice(0, 2).join(', ')) + (ls.length > 2 ? ` +${ls.length - 2}` : '') : 'None picked', 'sheet', 'leagues'); }
      case 3: return r(I.news, 'News section', esc((S.catalog.feeds.find((f) => f[0] === S.channels.news.feed) || [0, 'Top stories'])[1]), 'sheet', 'news');
      case 4: return r(I.sun, 'Town', S.channels.weather.label ? esc(S.channels.weather.label) : 'Not set yet', 'sheet', 'town');
      case 5: return r(I.fan, 'Visual style', esc(STYLE_NAMES[S.channels.visuals.style] || S.channels.visuals.style), 'sheet', 'style');
      case 6: return r(I.dia, esc(gameName()), esc(gamePlaying() ? gameStep() || 'Playing' : `${players().length} in the room`), 'tab', 'games');
      case 7: { const n = (S.golive.cams || []).length; return r(I.cam, n ? `${n} phone${n === 1 ? '' : 's'} live` : 'No phones yet', 'Share the camera link', 'sheet', 'live'); }
      case 8: return r(I.film, S.cinema.film ? esc(S.cinema.film.title) : 'Now Showing', filmLine(), 'sheet', 'film');
      case 9: { const o = S.bar.order; return r(I.coupe, o ? `${esc(title(o.drink.name))}${o.guest ? ` for ${esc(title(o.guest))}` : ''}` : 'Tonight\'s menu', o ? (o.phase === 'served' ? 'Served' : 'Making it now') : `${S.bar.menu.length} drinks on`, 'tab', 'bar'); }
    }
    return '';
  }
  const ctxPlain = (icon, b, sub, act, v) => `<button type="button" class="ctx" data-act="${act}" data-v="${v}"><span class="ico">${icon}</span><span class="t"><b>${b}</b><span>${sub}</span></span>${I.chev}</button>`;
  function renderWalls() {
    const sc = focusScreen(), msg = message();
    const tile = tileOf(sc.channel);
    const s1 = screen('s1'), s2 = screen('s2');
    const differ = split() && UI.scope === 'both';
    let head = TILES[tile - 1][1], mode = '';
    const rot = sc.playlist.filter((id) => slideById(id) && !slideById(id).processing);
    if (!S.displayOn) { head = 'Off'; mode = '<span>The HDMI is with another project</span><button type="button" data-act="sheet" data-v="hdmi">Take it back</button>'; }
    else if (S.settings.blackout) { head = 'Dark'; mode = `<span>${bothOn() ? 'Both walls are off' : 'The wall is off'}</span>`; }
    else if (msg) { head = 'Message'; mode = `<span>“${esc((msg.text || '').split('\n')[0])}”</span>`; }
    else if (sc.channel === 'nowshowing' || (S.cinema.film && RUNNING.includes(S.cinema.phase))) { head = 'Now Showing'; mode = `<span>${filmLine()}</span>`; }
    else if (sc.pinned && slideById(sc.pinned)) { head = slideById(sc.pinned).name; mode = `<span>Held on screen</span><button type="button" data-act="unpin">Back to ${sc.channel === 'rotation' ? 'rotation' : 'the channel'}</button>`; }
    else if (differ) mode = `<span>Left · right wall on ${esc(TILES[tileOf(s2.channel) - 1][1])}</span>`;
    else if (sc.channel === 'rotation') mode = rot.length ? `<span>Rotating · ${rot.length}</span>${rot.length > 1 ? '<button type="button" data-act="next">Next</button>' : ''}` : '<span>Nothing in rotation yet</span>';
    else mode = `<span>Channel ${shownNum(tile, sc.channel)}</span>`;
    if (tile === 6 && !msg && !S.settings.blackout && !sc.pinned && S.displayOn) head = gameName();
    const scopeTxt = !bothOn() ? (s1.enabled ? 'Left wall' : 'Right wall') : UI.scope === 's1' ? 'Left wall' : UI.scope === 's2' ? 'Right wall' : split() ? 'Walls differ' : 'Both walls';
    const filmTile = sc.channel === 'nowshowing';
    const leftT = tileOf(s1.channel), rightT = tileOf(s2.channel);
    const badge = (n) => {
      if (differ && n === leftT) return '<span class="air">LEFT</span>';
      if (differ && n === rightT) return '<span class="air out">RIGHT</span>';
      if (!differ && n === tile) return '<span class="air">ON AIR</span>';
      if (n === 7 && (S.golive.cams || []).length) return `<span class="cnt">${S.golive.cams.length}</span>`;
      if (n === 9 && drinkReqs().length) return `<span class="cnt">${drinkReqs().length}</span>`;
      return '';
    };
    // the hero's bottom row: the on-air channel's controls, or the way out of what covers the walls
    const showCtx = S.displayOn && !S.settings.blackout && !msg;
    const cover = !S.displayOn ? ctxPlain(I.moon, 'Walls are off', 'Take the HDMI back', 'sheet', 'hdmi')
      : S.settings.blackout ? ctxPlain(I.moon, 'Walls dark', 'Tap Lights up to bring them back', 'blackout', '')
      : msg ? ctxPlain(I.msg, 'Quick message', 'Change it or take it down', 'sheet', 'message') : '';
    const html = `
      <div class="hero"><div class="hrow">
        <div class="walls" aria-hidden="true">
          <div class="wall ${UI.scope === 's2' && bothOn() ? 'dim' : ''} ${!s1.enabled ? 'off' : ''}">${wallArt(s1)}</div>
          <div class="wall ${!s2.enabled ? 'off' : ''} ${UI.scope === 's1' && bothOn() ? 'dim' : ''}">${wallArt(s2)}</div>
        </div>
        <div class="herotxt">
          ${bothOn() ? `<button type="button" class="scope cap" data-act="sheet" data-v="scope" aria-label="Which walls: ${scopeTxt}">${scopeTxt} ${I.down}</button>` : `<span class="scope cap plain">${scopeTxt}</span>`}
          <h1 class="${head.length > 10 ? 'long' : ''}">${esc(head)}</h1>
          <div class="mode">${mode}</div>
        </div></div>
        ${showCtx ? ctxRow(filmTile ? 8 : tile) : cover}
      </div>
      <div class="sect"><span class="cap">Channels</span></div>
      <div class="grid">${TILES.map(([n, name]) => {
        const on = differ ? (n === leftT || n === rightT) : n === tile;
        return `<button type="button" class="ch ${on ? 'on' : ''}" data-act="ch" data-v="${n}" aria-pressed="${on}" aria-label="Channel ${shownNum(n, sc.channel)}, ${name}"><span class="n">${shownNum(n, sc.channel)}</span>${badge(n)}<span class="nm">${name}</span></button>`;
      }).join('')}</div>`;
    setHTML($('p-walls'), html);
  }

  // ------------------------------------------------------------ Bar

  function renderBar() {
    const o = S.bar.order, p = UI.pick;
    const onWall = enabled().some((s) => s.channel === 'pour');
    let h = `<h1>The House Pour</h1><div class="onair">${onWall ? '<span class="lit"><i class="dotg"></i>On the walls</span>' : '<span>Not on the walls</span><span>·</span><button type="button" class="lnk" data-act="ch" data-v="9">Put the menu up</button>'}</div>`;
    if (o) {
      const served = o.phase === 'served';
      h += `<div class="feature"><div class="glass">${glassSvg(o.drink.glass, o.drink.colour, served ? 1 : 0.55, 48, 64, 'now')}</div>
        <span class="cap">${served ? 'Served' : 'Making it now'}</span>
        <h2>${esc(title(o.drink.name))}</h2><div class="meta">${o.guest ? `for ${esc(title(o.guest))}` : 'for the house'}</div>
        <div class="acts">${served
          ? '<button type="button" class="btn" data-act="pourClear">Back to the menu</button>'
          : '<button type="button" class="btn goldline" data-act="served">Served</button><button type="button" class="btn" data-act="pourClear">Take it down</button>'}</div></div>`;
    }
    const names = (S.bar.names || []).map(title);
    const otherOn = p.guest && !names.includes(p.guest);
    h += `<div class="sect"><span class="cap">For</span></div>
      <div class="picks">${names.map((n) => `<button type="button" class="pick ${p.guest === n ? 'on' : ''}" aria-pressed="${p.guest === n}" data-act="forName" data-v="${esc(n)}"><span>${esc(n)}</span></button>`).join('')}
      <button type="button" class="pick ${otherOn ? 'on' : ''}" aria-pressed="${!!otherOn}" data-act="sheet" data-v="guestname"><span>${otherOn ? esc(p.guest) : names.length ? 'Someone else' : 'Add a name'}</span></button></div>

  const when = (iso) => { const d = new Date(iso); const today = new Date().toDateString() === d.toDateString(); return (today ? 'Tonight ' : d.toLocaleDateString([], { weekday: 'short' }) + ' ') + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }); };

  let lastFocus = null;
  function openSheet(name, arg) {
    if (!UI.sheet) lastFocus = document.activeElement;
    for (const k of ['filmEnd', 'del', 'season']) { clearTimeout(UI.armed[k]); delete UI.armed[k]; }
    if (UI.sheet === 'edit' && name !== 'edit') closeEditor();
    UI.sheet = name; UI.arg = arg || null;
    if (name === 'message') { const m = message(); UI.msgDraft = m ? m.text : ''; if (m && m.color) UI.msgColor = m.color; }
    if (name === 'film') { UI.film.results = null; UI.film.q = ''; }
    if (name === 'guestname') UI.other = UI.pick.guest && !(S.bar.names || []).map(title).includes(UI.pick.guest) ? UI.pick.guest : '';
    if (name === 'match') { UI.matches = null; loadMatches(); }
    if (name === 'years' || name === 'house') { UI[name] = null; loadList(name); }
    $('shBody').scrollTop = 0;
    renderSheet(true);
    $('sheet').classList.add('on'); $('scrim').classList.add('on');
    $('sheet').focus({ preventScroll: true });
    renderDock();
    const first = $('shBody').querySelector('#msgIn, #filmQ, #gname, #townIn');
    if (first && matchMedia('(pointer:fine)').matches) setTimeout(() => first.focus(), 50);
  }
  function closeSheet() {
    if (!UI.sheet) return;
    if (UI.sheet === 'edit') closeEditor();
    UI.sheet = null; UI.arg = null;
    $('sheet').classList.remove('on'); $('scrim').classList.remove('on');
    $('toast').classList.remove('over');
    setTimeout(() => { if (!UI.sheet) { setHTML($('shBody'), ''); const t = $('shTop'); t.innerHTML = ''; t.dataset.key = ''; t.hidden = true; } }, 350);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    renderDock();
  }
  // Re-renders the open sheet from state, keeping a focused field's text, caret and the scroll.
  function renderSheet(force) {
    if (!UI.sheet || !S) return;
    const s = SHEETS[UI.sheet]();
    if (s.fixed && !force) return;
    const bd = $('shBody');
    const act = document.activeElement;
    const keep = act && bd.contains(act) && act.id ? { id: act.id, value: act.value, a: act.selectionStart, b: act.selectionEnd } : null;
    const scroll = bd.scrollTop;
    $('shCap').textContent = s.cap;
    const top = $('shTop');
    if ((s.topKey || '') !== (top.dataset.key || '')) {
      top.dataset.key = s.topKey || '';
      top.innerHTML = s.top || '';
      top.hidden = !s.top;
      if (UI.sheet === 'edit') hookEditor();
    }
    const changed = setHTML(bd, s.body);
    setHTML($('shFoot'), s.foot || '');
    $('shFoot').hidden = !s.foot;
    $('sheet').classList.toggle('tall', !!s.tall);
    bd.style.paddingBottom = s.foot ? '' : 'calc(28px + var(--safe))';
    if (changed) {
      bd.scrollTop = scroll;
      if (keep) {
        const el = $(keep.id);
        if (el) { el.value = keep.value; el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.a, keep.b); } catch (e) {} }
      }
      bd.querySelectorAll('input[type=range]').forEach(paintRange);
    }
  }

  // ------------------------------------------------------------ render

  function render() {
    if (!S) return;
    renderTop();
    ({ walls: renderWalls, bar: renderBar, games: renderGames, settings: renderSettings })[UI.tab]();
    document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === 'p-' + UI.tab));
    renderDock();
    renderSheet();
  }
  // Called on each snapshot: housekeeping that depends on what the server says.
  let cleaned = false;
  function prep() {
    if (S.cinema) S.cinema.clock = S.cinema.now - Date.now() / 1000;
    if (!bothOn() && UI.scope !== 'both') UI.scope = 'both';
    if (UI.pick.drink && !S.bar.menu.some((d) => d.id === UI.pick.drink)) UI.pick.drink = '';

  // uploads: one at a time with progress; each lands in the rotation of the walls in scope
  $('fileInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';

  });
  function upload(file) {
    return new Promise((resolve) => {
      const u = { name: file.name || 'Upload', pct: 0, err: '' };
      UI.uploads.push(u); renderSheet();
      let name = file.name || 'upload';
      if (!/\.[a-z0-9]{2,5}$/i.test(name)) name += EXT_FOR[file.type] || '';
      const walls = scopeWalls();
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `/api/upload?name=${encodeURIComponent(name)}&addTo=${walls[0].id}`);
      xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) { u.pct = (ev.loaded / ev.total) * 100; renderSheet(); } };
      const done = (err) => {
        if (err) { u.err = err; renderSheet(); setTimeout(() => { UI.uploads = UI.uploads.filter((x) => x !== u); renderSheet(); }, 6000); }
        else { UI.uploads = UI.uploads.filter((x) => x !== u); renderSheet(); }
        resolve();
      };
      xhr.onload = async () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { const s = JSON.parse(xhr.responseText); if (walls.length > 1) await addToScope(s.id); } catch (err) {}
          done('');
        } else {
          let msg = 'Upload failed.';
          try { msg = JSON.parse(xhr.responseText).error || msg; } catch (err) {}
          done(msg);
        }
      };
      xhr.onerror = () => done('Upload failed. Check you\'re on the same Wi-Fi as the Pi.');
      xhr.send(file);
    });
  }

  function openEditor(id, fresh) {
    const s = fresh || slideById(id);
    if (!s) return;
    UI.editing = { id, local: { ...s }, dirty: {} };
    for (const k of ['del']) { clearTimeout(UI.armed[k]); delete UI.armed[k]; }
    if (UI.sheet !== 'edit') { if (!UI.sheet) lastFocus = document.activeElement; UI.sheet = 'edit'; }
    $('shBody').scrollTop = 0;
    renderSheet(true);
    $('sheet').classList.add('on'); $('scrim').classList.add('on');
    renderDock();
  }
  function hookEditor() {
    const f = $('edFrame'), e = UI.editing;
    if (!f || !e) return;
    f.dataset.ready = '0';
    f.src = `/display?preview=${focusScreen().id}&slide=${e.id}`;
  }
  function edState() { return { ...S, slides: S.slides.map((s) => (UI.editing && s.id === UI.editing.id ? { ...s, ...UI.editing.local } : s)) }; }
  function pushPreview() {
    const f = $('edFrame');
    if (f && f.contentWindow && f.dataset.ready === '1' && S) f.contentWindow.postMessage({ type: 'state', state: edState() }, location.origin);
  }
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'preview-ready') return;
    const f = $('edFrame');
    if (f && f.contentWindow === e.source) { f.dataset.ready = '1'; pushPreview(); }
  });
  const savePatch = debounce(() => {
    const e = UI.editing;
    if (!e || !Object.keys(e.dirty).length) return;
    const { id, dirty } = e;
    e.dirty = {};
    quiet(write('PATCH', `/api/slides/${id}`, dirty));
  }, 350);
  function setField(key, value) {
    const e = UI.editing;
    if (!e) return;
    e.local[key] = value;
    e.dirty[key] = value;
    pushPreview();
    savePatch();
  }
  function closeEditor() {
    if (UI.editing) savePatch.flush();
    UI.editing = null;
  }

  // ------------------------------------------------------------ timers

  setInterval(() => {
    if (!S || !S.cinema) return;
    const c = S.cinema;
    if (!['countdown', 'intermission'].includes(c.phase)) return;
    const t = mmss(c.until - cinemaNow());
    document.querySelectorAll('[data-timer]').forEach((el) => { el.textContent = t; });
  }, 1000);

  // ------------------------------------------------------------ live connection

  function connect() {
    const es = new EventSource('/api/events');
    es.onopen = () => { connected = true; if (S) render(); };
    es.onmessage = (e) => {
      try { S = JSON.parse(e.data); } catch (err) { return; }
      connected = true;
      prep();
      render();
      if (UI.sheet === 'edit') pushPreview();
    };
    es.onerror = () => {
      connected = false;
      if (S) renderTop();
      if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
    };
  }
  // The games' roster and the party game's wall view (passive, like a wall): who's in the room,
  // and whether a game is waiting for players or playing. Closed while the page is hidden.
  let gs = null;
  function gameStream() {
    if (gs || document.hidden) return;
    gs = new EventSource('/api/game/stream?role=display');
    gs.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.type === 'roster') { roster = m; if (!m.party) partyView = null; }
      else if (m.type === 'party') partyView = m;
      else return;
      if (S && (m.type === 'roster' || renderPartyThrottle())) render();
    };
    gs.onerror = () => { if (gs && gs.readyState === EventSource.CLOSED) { gs = null; setTimeout(gameStream, 3000); } };
  }
  // party views come several times a second during play; the remote only needs them now and then
  let lastParty = '';
  function renderPartyThrottle() {
    const key = partyView ? `${partyView.game}|${partyView.phase}|${partyView.round}|${partyView.n}|${JSON.stringify(partyView.score || '')}|${partyView.match ? partyView.match.id : ''}` : '';
    if (key === lastParty) return false;
    lastParty = key;
    return true;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (gs) { gs.close(); gs = null; } }
    else gameStream();
  });
  connect();
  gameStream();
})();
</script>
</body>
</html>
